/**:
  ros__parameters:
    # ---------------------------------------------------------------------------
    # F1/10 platform — vehicle physical params shared across ALL backends.
    # Overlay on top of config/mpc_parameters.yaml (base). Cost weights + speed
    # policy + horizon/solver config live in config/weights/f1tenth_<backend>.yaml.
    # Stack order (highest wins): weights > platform > base.
    # ---------------------------------------------------------------------------
    use_sim_time: False

    # 4-Tec 2.0 VXL / F1-10 car
    wheelbase: 0.256
    control_rate: 20.0

    # Speed / accel limits
    max_speed: 1.5
    min_speed: -1.5
    max_accel: 3.0
    max_decel: -3.0

    # Steering limits (deg at the road wheel; converted to rad internally).
    # NOTE: 27 is a GUESS for the 4-Tec 2.0 VXL — measure real lock-to-lock and
    # update. max_steer_rate derated from the stock Traxxas 2075 servo.
    max_steer: 27.0
    min_steer: -27.0
    max_steer_rate: 183.346494

    # Tolerances (vehicle-scale)
    distance_tolerance: 0.2
    speed_tolerance: 0.5

    saturate_input: True
    allow_reversing: True

    # Ego collision geometry — physical, so it belongs here rather than only in
    # config/weights/f1tenth_*_obstacle.yaml (which set the identical values and,
    # being higher in the stack, still win). Without these the `ego_radius: -1.0`
    # sentinel in mpc_parameters.yaml resolves to DEFAULT_EGO_RADIUS — a *Carla
    # Model 3* bounding sphere, 2.10 m — giving a 2.60 m keep-out around a 0.58 x
    # 0.31 m car. That is only cosmetic at num_obstacles: 0 (two huge rings in the
    # visualizer), but it is ENFORCED the moment num_obstacles > 0, and a 2.6 m
    # bubble swallows the path and deadlocks avoidance.
    #
    # The two discs cover the half-rectangles of the 0.58 x 0.31 m footprint whose
    # rear axle sits 0.19 m from the tail. Inflating a single radius to the
    # circumscribing ~0.50 m instead would widen every detour.
    # NOTE: ego_disc_offsets sets the generated constraint-row count, so changing
    # it needs generate_mpc_model:=True — exactly like num_obstacles.
    ego_radius: 0.212
    ego_disc_offsets: [0.045, 0.335]
    safe_distance: 0.15
