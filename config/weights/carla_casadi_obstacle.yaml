/**:
  ros__parameters:
    # ---------------------------------------------------------------------------
    # CARLA × CasADi — EXACT (sqpmethod) obstacle avoidance.
    # Tracking weights / reference levers are the tuned carla_casadi.yaml set
    # (Town01 moving route, true CTE mean 0.032 m / max 0.298 m); the obstacle
    # block mirrors carla_acados_obstacle.yaml so the two backends enforce the
    # SAME keep-out geometry and are directly comparable run-to-run.
    # Overlay (highest wins): weights > platforms/carla.yaml > base.
    # Launch:
    #   mpc_toolbox:=casadi platform:=carla weights:=carla_casadi_obstacle \
    #       num_obstacles:=N generate_mpc_model:=true \
    #       obstacle_topic:=/carla/merged_obstacles
    # Feed: /carla/merged_obstacles = dynamic CARLA actors merged with static
    # level geometry (light poles, sign posts, traffic-light masts). The
    # dynamic-actors-only predecessor was /carla/ego_vehicle/objects; poles are
    # invisible on it, which is how a detour hit one. Static geometry competes
    # for the same num_obstacles slots — watch n_selected / sel_id in the CSV.
    #
    # Unlike the solver_type=qp + ltv path (see f1tenth_casadi_qp_obstacle.yaml),
    # which LINEARIZES the exterior-of-circle keep-out about a per-stage operating
    # point (soft, and the linearization gradient vanishes head-on), this uses the
    # quad/qrqp sqpmethod path on the full nonlinear model and carries the EXACT
    # squared-distance constraint; the SQP convexify layer handles its
    # nonconvexity. At CARLA scale (9 m/s straights, ~6 m keep-out radii) the
    # exact constraint is what makes the detour commit early enough.
    # ---------------------------------------------------------------------------
    horizon: 25
    sample_time: 0.05
    prediction_time: 1.25  # sample_time * horizon

    # EXACT nonconvex-constraint path: sqpmethod on the full nonlinear model.
    solver_type: quad
    solver: qrqp
    discrete_model_type: nonlinear
    discrete_integration_method: rk4
    # PD Hessian: required for a well-conditioned qrqp QP. Without it the u-rate
    # slack leaves zero rows in the Hessian -> singular H -> multi-second solves
    # and Search_Direction_Becomes_Too_Small at fast corners.
    slack_objective_is_quadratic: True

    # max_iter is the sqpmethod OUTER iteration count and behaves as a TIME BUDGET
    # next to a nonconvex keep-out, not a convergence knob: the adapter accepts a
    # budget-limited iterate as usable (RTI-style), so a capped solve is not a
    # failure. Same lesson as carla_acados_obstacle.yaml's max_iter 20 — and it is
    # NOT optional at CARLA scale. Measured on the Town01 route with the 6-obstacle
    # set, `max_iter: 200` (the value carla_casadi.yaml uses with no obstacles):
    # solve p50 6.7 ms but p95 91 ms and a 4.5 s degenerate
    # Search_Direction_Becomes_Too_Small next to the cybertruck keep-out. A
    # multi-second solve is not just a dropped tick — the plant keeps integrating
    # the last command, so at 8 m/s the vehicle travels ~40 m while the control
    # loop is blocked, which is far outside projection_window and the reference
    # projection reports 'lost' and never re-acquires. The run stopped dead at
    # ref_idx 256 of 1431, twice, reproducibly.
    # Raising the cap does not fix a limit cycle; it only lengthens the stall.
    max_iter: 25
    # Loose, obstacle-appropriate tolerance: 1e-4 (the no-obstacle value) chases a
    # stationarity residual the nonconvex keep-out limit-cycles on and burns the
    # whole budget every solve.
    termination_condition: 0.1
    # Bounds the INNER qrqp QP. max_iter alone does not: capping outer iterations
    # 200 -> 25 pulled solve p95 from 91 ms to 27 ms but made the one degenerate
    # Search_Direction_Becomes_Too_Small solve WORSE (4.5 s -> 7.9 s), because that
    # solve is one inner QP grinding, not outer iterations accumulating. This is
    # the knob that bounds it (0 = plugin default = unbounded). Adding it took the
    # run from ref_idx 251 to 598 of 1431 (5 of 6 obstacles passed, 0 physical
    # overlaps, min clearance +0.692 m, solve p50 13 ms / p95 30 ms).
    #
    # KNOWN RESIDUAL — read before a long CARLA run. It bounds the stall but does
    # not remove it: p99 was still 518 ms with a 2.26 s worst case and 23
    # Search_Direction_Becomes_Too_Small solves, and the run eventually lost the
    # path the same way just past bike_2. So this config avoids obstacles
    # correctly but is not yet proven to hold a full CARLA-scale route. Prefer
    # acados for long obstacle runs until this is closed; next levers to try are
    # sqp_convexify_strategy: eigen-clip, sqp_hessian_approximation:
    # limited-memory, or the solver_type: qp + discrete_model_type: ltv path
    # (one QP per tick, so a degenerate outer loop is structurally impossible —
    # at the cost of a linearized, weaker keep-out).
    qp_inner_max_iter: 100

    # Obstacle avoidance (Euclidean, EXACT squared distance on the quad path).
    # The launch argument remains authoritative over this overlay; keep
    # num_obstacles:=6 on the launch line. Rebuild once after changing the slot count.
    num_obstacles: 6
    obstacle_collision_avoidance_method: euclidean
    # Keep-out from an obstacle centre = ego_radius + obstacle_radius +
    # safe_distance, enforced at EACH ego collision disc. The default ros-bridge
    # ego (Tesla Model 3-class) is ~4.69 x 1.85 m with roughly 1.0 m of rear
    # overhang, so the body spans about [-1.0, +3.7] m along x from the rear-axle
    # reference point. With n discs each covers a sub-rectangle of length
    # L = (x_front - x_rear)/n and carries radius = hypot(L, w)/2, centred at
    # x_rear + L*(k + 1/2).
    #
    # FOUR discs, not two: the disc radius is a circumscribing radius applied
    # omnidirectionally, so at n=2 (1.50 m) it over-states the 0.925 m half-width by
    # 0.57 m per side. On a ~3.5 m Town01 lane that made every kerbside pole an
    # active constraint (2.23 m demanded vs 2.1-2.34 m available); n=4 needs 1.82 m
    # and clears the same furniture by ~0.5 m. See carla_acados_obstacle.yaml.
    #
    # CHANGING ego_disc_offsets CHANGES THE NUMBER OF GENERATED CONSTRAINT ROWS,
    # so it needs generate_mpc_model:=True, exactly like num_obstacles.
    # These three MUST match carla_acados_obstacle.yaml or a CasADi-vs-acados
    # comparison is measuring different geometry.
    ego_radius: 1.096
    ego_disc_offsets: [-0.4125, 0.7625, 1.9375, 3.1125]
    # Comfort margin on top of the disc radii. Vehicle-scale (the F1/10 uses
    # 0.15 m); also the spendable band the braking envelope lets the solver use
    # during recovery. Raise it to start detours earlier and carry more speed.
    safe_distance: 0.4
    # Split elongated BOX reports into tight planar discs before slot ranking.
    # The six-slot generated model must be rebuilt once after enabling this.
    decompose_obstacle_boxes: true
    # Lateral detour bound. Beyond this displacement the reference stops bending
    # around the obstacle and instead keeps its raw geometry with a braking speed
    # profile, so the car halts short of the keep-out rather than leaving the road
    # (Town01 lanes are ~3.5 m). 0.0 restores the unbounded detour.
    # Kept in sync with carla_acados_obstacle.yaml, where the reasoning lives: 2.0
    # bound on 95% of ticks of a measured run and left the car crawling at a median
    # of 0.18 m/s; the required detour's median was 3.10 m. Raising it to 3.5 was
    # nonetheless reverted — see the acados overlay for the measurements.
    max_avoidance_offset: 2.0
    # Floor on every parsed obstacle radius. Kept in sync with the acados overlay:
    # the 0.3 default inflates a 0.168 m CARLA bollard into a 1.796 m keep-out.
    # Left at the 0.3 code default for now, same reasoning as the acados overlay.
    # Radius within which a reported object is converted to keep-out discs at all.
    # Kept in sync with carla_acados_obstacle.yaml, where the reasoning lives: the
    # merged feed's whole-level geometry costs ~115 ms of CPU per message to convert,
    # which starves the control thread. 0.0 disables the gate.
    obstacle_ingest_radius: 50.0
    # Distance at which the projection guide starts growing toward its full radius.
    # Without it the projection switches on as a one-tick multi-metre sideways step;
    # CasADi tracked that step with a +-70 deg lunge and an underdamped rejoin. The
    # OCP keeps the full, unramped keep-out at all times — this shapes only the
    # tracking target.
    # NOTE: the detour bound above is evaluated against the RAMPED radius, so the
    # stop-vs-swerve decision cannot fire before the ramp is well underway. At
    # 8 m/s the ramp completes ~10 m out (sample_time * horizon * v) and the 2.0 m
    # bound is crossed ~16 m out, still ahead of the ~11 m braking distance — that
    # margin shrinks if this distance is lowered or the route speed is raised.
    keepout_engagement_distance: 25.0
    # No-progress watchdog: zero the command when a drive command is applied but
    # neither the reference index nor the position moves. 8.0 s (default 5.0)
    # because a CARLA ego can legitimately sit near-stationary at full throttle for
    # ~5 s while pulling away from the spawn.
    progress_watchdog_timeout: 8.0
    # Opt-in recovery for a stationary detour-bound stop: preserve the lateral
    # offset the vehicle already occupies and command no additional outward room.
    forward_escape_enabled: true
    forward_escape_speed: 1.0
    # SLACK-WEIGHT LEVER: the keep-out is soft/slacked so it stays feasible when
    # the reference is briefly inside the bubble. Raising this hardens avoidance —
    # try 1000 -> 10000 -> 100000 to force progressively larger deviation. A single
    # value broadcasts to every obstacle. Restart-only (baked into the OCP at
    # build; keep generate_mpc_model:=true when you change it).
    slack_weights_obstacle_avoidance: [1000.0]
    slack_upper_bound_obstacle_avoidance: [1000.0]
    # State-based braking envelope OFF (advisory: diagnostics still logged, no
    # intervention) at CARLA scale. A/B on carla_town01_moving with 6 obstacles
    # (2026-08-02): envelope off IMPROVED min physical clearance (+0.797 vs
    # +0.325 m — the envelope's brake-lurch cycle near the boundary degraded
    # tracking), 0 overlaps, 20% faster. Keep it TRUE on the F1/10 configs
    # (0.66 m keep-outs at 1.5 m/s — there it is load-bearing).
    # Consider re-enabling for live runs with MOVING obstacles until validated.
    # Hot-reloadable: ros2 param set <node> obstacle_braking_envelope true
    obstacle_braking_envelope: false

    # Tuned Town01 tracking set (see carla_casadi.yaml for the derivation):
    # modest position authority with high steering-rate damping for stability on
    # the ~9 m/s straights, and a low accel-axis penalty so it can brake into the
    # corners. Velocity weight highest in Q/Qf, yaw lowest.
    Q:  [5.0, 5.0, 15.0, 0.05]
    R:  [0.5, 100.0]
    Rd: [1.0, 1000.0]
    Qf: [10.0, 10.0, 30.0, 0.1]
    use_bryson_weights: false

    use_speed_profile: True
    # Curvature speed cap; slows the hairpins to ~5 m/s. NOTE this inherits the
    # tuned CasADi value (1.2) while carla_acados_obstacle.yaml inherits acados'
    # (1.0) — a pre-existing per-backend tuning difference, not an obstacle
    # choice. It shapes the reference, which is backend-independent, so a strict
    # CasADi-vs-acados A/B should pin BOTH files to the same value first.
    max_lateral_accel: 1.2
    min_reference_speed: 0.3

    # Reference anchor distance. Platform default 5.0 m over-anchors and cuts the
    # R~12 m corners; 2.5 m tracks the near path. Do NOT drop below ~2.5 (stalls).
    distance_tolerance: 2.5

    # The OCP structure includes the obstacle constraints, so the model must be
    # (re)generated when this overlay is first used or when num_obstacles /
    # ego_disc_offsets / the slack weights change.
    generate_mpc_model: True
    build_with_cython: True
