/**:
  ros__parameters:
    # ---------------------------------------------------------------------------
    # F1/10 × acados — obstacle avoidance (EXACT nonlinear keep-out constraint).
    # Overlay (highest wins): weights > platforms/f1tenth.yaml > base.
    # Launch (EXTERNAL cost is the default now, but obstacles REQUIRE it):
    #   mpc_toolbox:=acados weights:=f1tenth_acados_obstacle \
    #       stage_cost_type:=EXTERNAL terminal_cost_type:=EXTERNAL \
    #       num_obstacles:=1 generate_mpc_model:=true
    #
    # acados adds the obstacle as an exact nonlinear con_h constraint (slacked), so
    # unlike the CasADi qp/ltv path it is not linearized — on-path / head-on
    # avoidance is strong. Obstacles need EXTERNAL cost (the only cost type that both
    # carries the Rd rate penalty and enables the constraint block).
    # ---------------------------------------------------------------------------
    horizon: 25
    sample_time: 0.05
    prediction_time: 1.25
    termination_condition: 0.1

    # Full SQP (SQP_RTI's single step is too weak near a corner + obstacle).
    nlp_solver_type: SQP
    # 20 (was 40): near the nonconvex keep-out the SQP limit-cycles on the
    # stationarity residual and consumes ANY iteration budget — capped-solve counts
    # are cap-invariant (169/150/143/156 at 20/40/60/100 on the on-path-obstacle
    # rollout) while worst-case solve time scales with the cap (p99 32 ms at 20 vs
    # 147 ms at 100; budget 50 ms). Tracking is unchanged (same course completion,
    # 0 failures, CTE within run spread); the budget-limited status-2 iterate is
    # accepted RTI-style, so capped solves are not failures. The old "40 breaks the
    # launch failure cluster" rationale predates that acceptance policy and no
    # longer applies. Globalization (MERIT_BACKTRACKING) and Levenberg
    # regularization do NOT break the limit cycle either — don't re-try them as a
    # substitute for the cap.
    max_iter: 20

    # Obstacle avoidance (exact nonlinear con_h). num_obstacles is NOT set here — it is
    # a launch arg applied after this overlay so it stays authoritative (a weights pin
    # would silently cap the count a `num_obstacles:=N` asked for). Pass num_obstacles:=N
    # (default 0) + generate_mpc_model:=true on the launch command.
    obstacle_collision_avoidance_method: euclidean
    # Keep-out = ego_radius + obstacle_radius + safe_distance = 0.15 + r_obs + 0.15.
    # An obstacle exactly ON the line is supported: the adapter projects in-keep-out
    # reference points onto the keep-out boundary (side-hysteresis arc) and accepts
    # budget-limited (status 2) SQP iterates, so the car detours ~0.6 m around the
    # bubble instead of stalling. Expect status=2 log blips while negotiating it.
    ego_radius: 0.15
    safe_distance: 0.15  # now wired into the acados keep-out (was hardcoded 0.5)
    # SLACK-WEIGHT LEVER (restart-only): acados uses a SCALAR obstacle_slack_weight
    # (NOT the CasADi array params). Raise to harden avoidance (default 100).
    obstacle_slack_weight: 1000.0

    Q:  [100.0, 100.0, 100.0, 16.0]
    Qf: [200.0, 200.0, 200.0, 40.0]
    R:  [0.01, 0.01]
    Rd: [10.0, 10.0]
    use_bryson_weights: false

    use_speed_profile: True
    max_lateral_accel: 3.0
    min_reference_speed: 0.3

    # acados C-code generation + Cython wrapper (regenerate when the obstacle
    # structure / horizon changes).
    generate_mpc_model: True
    build_with_cython: True
