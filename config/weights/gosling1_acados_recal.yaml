/**:
  ros__parameters:
    # ---------------------------------------------------------------------------
    # gosling1 (F1/10) × acados — POST-RECALIBRATION counterpart of
    # gosling1_acados.yaml. Identical in every respect except max_steer.
    # Overlay (highest wins): weights > platforms/f1tenth.yaml > base.
    #
    #   ros2 launch trajectory_following_ros2 closed_loop_sim.launch.py \
    #       platform:=f1tenth weights:=gosling1_acados_recal mpc_toolbox:=acados \
    #       waypoints_csv:=<repo>/data/gosling1_figure8_odomframe.csv
    #
    # The servo WAS recalibrated on this car (2026-08-07); the constants below are
    # from that calibration, so this file is the one to run on hardware. The older
    # 14.32 deg figure came from a calibration produced on a different F1/10 and no
    # longer applies. See the max_steer block for the derivation and its one
    # remaining unverified input.
    # ---------------------------------------------------------------------------
    horizon: 25
    sample_time: 0.05
    prediction_time: 1.25
    termination_condition: 0.1

    nlp_solver_type: SQP
    max_iter: 20

    Q:  [100.0, 100.0, 100.0, 16.0]
    Qf: [200.0, 200.0, 200.0, 40.0]
    R:  [0.01, 0.01]
    Rd: [10.0, 10.0]
    use_bryson_weights: false

    # What the servo can actually DELIVER, not a mechanical lock and not a guess.
    # From the recalibrated VESC conversion (relayed 2026-08-09, measured on this
    # car 2026-08-07):
    #
    #   servo = -1.1448 * delta + 0.56,  servo clamped to [0.08, 0.92]
    #     -> right lock (servo 0.92): delta = -0.3145 rad = -18.02 deg
    #     -> left  lock (servo 0.08): delta = +0.4193 rad = +24.02 deg
    #
    # The cap is the SMALLER extreme, applied symmetrically: anything past 18 deg
    # to the right is clipped inside the driver with no error reported, and on the
    # 2026-08-08 ground legs the controller commanded past that right-hand bound on
    # ~45% of physically-moving ticks (0% past the left one). A controller allowed
    # 23 deg therefore plans right-hand corners this car will not execute.
    #
    # 18.0 deg puts the tightest achievable radius at 0.256 / tan(18.0) = 0.79 m
    # against a recorded route minimum of ~0.85 m — feasible, but with little
    # margin, so watch right-hand-corner CTE.
    #
    # PROVISIONAL in one respect: the gain and offset are measured, but servo_min /
    # servo_max ([0.08, 0.92]) are inherited from another car and servo_min was
    # never reached in any archived bag — so the LEFT extreme has no empirical
    # backing at all. That asymmetry is why this is a symmetric cap at the
    # evidence-backed (right) bound rather than an asymmetric one. Recompute from
    # the f1tenth bench sweep when it lands; do not hard-code 18.0 from memory.
    # Keep in step with TRACK_MAX_STEER_DEG in track_route_gosling1.sh.
    max_steer: 18.0
    min_steer: -18.0

    # Speed ceiling for a gosling1 route run. Pinned HERE rather than passed as a
    # launch argument for the same reason as max_steer above: platforms/f1tenth.yaml
    # sets max_speed 1.5 and the platform overlay is applied after the launch args,
    # so `max_speed:=...` on the command line is silently discarded — measured on the
    # car 2026-08-06, where a run launched with 0.8 read back 1.5 on the node.
    #
    # 1.0 against a recorded route profile of ~0.7 m/s leaves headroom for the
    # reference-anchor overshoot (~1.14x forward, ~1.31x reverse) without letting a
    # transient run away at the platform's 1.5.
    max_speed: 1.0
    min_speed: -1.0

    use_speed_profile: True
    max_lateral_accel: 3.0
    min_reference_speed: 0.3

    generate_mpc_model: True
    build_with_cython: True
