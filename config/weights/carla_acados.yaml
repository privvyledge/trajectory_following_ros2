/**:
  ros__parameters:
    # ---------------------------------------------------------------------------
    # CARLA × acados — UNTUNED. Seeded from the known-good carla_do_mpc set.
    # Overlay (highest wins): weights > platforms/carla.yaml > base. RE-TUNE for acados.
    # ---------------------------------------------------------------------------
    horizon: 50
    sample_time: 0.05
    prediction_time: 2.5
    max_iter: 200
    termination_condition: 0.0001

    Q:  [1.0, 1.0, 10.0, 0.01]
    R:  [10.0, 100.0]
    Rd: [100.0, 1000.0]
    Qf: [0.002, 0.002, 0.0001, 0.00001]
    use_bryson_weights: false

    use_speed_profile: True
    max_lateral_accel: 3.0
    min_reference_speed: 0.3

    # Build once, then flip to False to skip the per-launch recompile
    # (acados C-gen / do_mpc AOT ~min; casadi JIT ~secs). Re-True only if
    # the model form / horizon / num_obstacles change.
    generate_mpc_model: True
    build_with_cython: True
