/**:
  ros__parameters:
    # ---------------------------------------------------------------------------
    # CARLA × acados — obstacle avoidance (EXACT nonlinear keep-out constraint).
    # Tracking weights/reference levers are the tuned carla_acados.yaml set
    # (Town01 moving route); the obstacle block mirrors f1tenth_acados_obstacle
    # scaled to the CARLA ego.
    # Overlay (highest wins): weights > platforms/carla.yaml > base.
    # Launch (obstacles REQUIRE EXTERNAL cost):
    #   mpc_toolbox:=acados platform:=carla weights:=carla_acados_obstacle \
    #       stage_cost_type:=EXTERNAL terminal_cost_type:=EXTERNAL \
    #       num_obstacles:=N generate_mpc_model:=true \
    #       obstacle_topic:=/carla/merged_obstacles
    # Feed: /carla/merged_obstacles = dynamic CARLA actors merged with static
    # level geometry (light poles, sign posts, traffic-light masts). The
    # dynamic-actors-only predecessor was /carla/ego_vehicle/objects; poles are
    # invisible on it, which is how a detour hit one. Static geometry competes
    # for the same num_obstacles slots — watch n_selected / sel_id in the CSV.
    # ---------------------------------------------------------------------------
    horizon: 25
    sample_time: 0.05
    prediction_time: 1.25
    termination_condition: 0.1

    # Full SQP; treat max_iter as a TIME BUDGET, not a convergence knob. Near a
    # nonconvex keep-out the SQP limit-cycles on the stationarity residual and
    # consumes any iteration budget; the budget-limited status-2 iterate is
    # accepted RTI-style, so capped solves are not failures. (The no-obstacle
    # carla_acados.yaml uses max_iter 200 / termination 1e-4 — that pairing burns
    # the whole 200 every solve next to a keep-out.)
    nlp_solver_type: SQP
    max_iter: 20

    # Obstacle avoidance (exact nonlinear con_h). The launch argument remains
    # authoritative over this overlay; keep num_obstacles:=10 on the launch line.
    # The first run after changing the slot count needs generate_mpc_model:=true.
    # 6 starved on the dense CARLA feed: run A2 held the cap for 74% of its rows
    # (saturated from row 200) and the struck obstacle never won a slot. At 10 the
    # cap stopped binding (peak 8-10, ~4% of rows) at no cadence cost.
    num_obstacles: 10
    obstacle_collision_avoidance_method: euclidean
    # Keep-out = ego_radius + obstacle_radius + safe_distance, enforced at EACH
    # ego collision disc. The default ros-bridge ego (Tesla Model 3-class) is
    # ~4.69 x 1.85 m with roughly 1.0 m of rear overhang, so the body spans about
    # [-1.0, +3.7] m along x from the rear-axle reference point. With n discs each
    # covers a sub-rectangle of length L = (x_front - x_rear)/n and carries
    # radius = hypot(L, w)/2, centred at x_rear + L*(k + 1/2).
    #
    # FOUR discs, not two. The disc radius is a *circumscribing* radius applied
    # omnidirectionally, so it over-states the half-width (0.925 m) by whatever the
    # sub-rectangle's length contributes — at n=2 that is 1.50 m, i.e. 0.57 m of
    # phantom lateral bulk on each side. On a ~3.5 m Town01 lane that is the
    # difference between clearing the kerb and not: against a 0.3 m post the keep-out
    # demands 2.23 m of lateral room while Town01 street furniture sits 2.1-2.34 m
    # from the lane centre, so every pole and traffic-light mast became an active
    # constraint with ~0.1 m to spare and the solver spent the run at the edge of
    # infeasibility. n=4 drops the radius to 1.10 m and the demand to 1.82 m, which
    # clears the same furniture by ~0.5 m. Measured cost is under 1 ms of ranking;
    # it does double the generated con_h rows (6 obstacles x 4 discs = 24).
    #
    # CHANGING ego_disc_offsets CHANGES THE NUMBER OF GENERATED CONSTRAINT ROWS,
    # so it needs generate_mpc_model:=True, exactly like num_obstacles.
    ego_radius: 1.096
    ego_disc_offsets: [-0.4125, 0.7625, 1.9375, 3.1125]
    # Comfort margin on top of the disc radii. Vehicle-scale (the F1/10 uses
    # 0.15 m); also the spendable band the braking envelope lets the solver use
    # during recovery. Raise it to start detours earlier and carry more speed.
    safe_distance: 0.4
    # Split elongated BOX reports into tight planar discs before slot ranking.
    # The six-slot generated model must be rebuilt once after enabling this.
    decompose_obstacle_boxes: true
    # Lateral detour bound. Beyond this displacement the reference stops bending
    # around the obstacle and instead keeps its raw geometry with a braking speed
    # profile, so the car halts short of the keep-out rather than leaving the road
    # (Town01 lanes are ~3.5 m). 0.0 restores the unbounded detour.
    #
    # 2.0 was measured to bind on essentially every obstacle on this route, not just
    # the parked vehicles: over a clean 900 s run the reference was in stop-short mode
    # on 95% of ticks (3773/3965) and the required detour had a median of 3.10 m. The
    # result was safe but not driveable — median applied speed 0.18 m/s, 59% of ticks
    # below 0.5 m/s, stopping at 16-19 m out and then crawling past at 0-1.4 m/s.
    # 3.5 clears that median with margin. It does permit crossing into the oncoming
    # lane, which the car already does when squeezing past the parked truck.
    #
    # 3.5 was nonetheless REVERTED to 2.0: it converts a deliberate, labelled
    # detour-bound stop (avoidance_stop=1) into an unlabelled stall only the
    # no-progress watchdog catches, it buys no clearance (2.0's minimum approach was
    # closer, 0.269 m vs 0.399 m), and — decisively — it permitted a 2.26 m reference
    # swing out of the lane that drove the ego into a light pole at -0.931 m
    # penetration, the only physical overlap ever recorded on this route. (Route
    # progress does not separate the two settings: config-identical 2.0 runs reached
    # index 447 and 139, so the outcome at the pinch is bimodal, not config-driven.)
    max_avoidance_offset: 2.0
    # Floor on every parsed obstacle radius. The default 0.3 is sized for f1tenth
    # perception noise; on this feed 183 of 188 reported objects are BARRIER-class
    # street furniture, and the floor turns a 0.168 x 0.168 m bollard into a
    # 0.3 + ego_radius 1.096 + safe_distance 0.4 = 1.796 m keep-out — half a 3.5 m
    # lane for a 17 cm post. CARLA reports true dimensions, so the floor only needs
    # to catch the zero-dimension actors it also reports.
    # Left at the 0.3 code default for now: it was lowered to 0.1 in the same run
    # whose detour bound is reverted above, and was never separately measured.
    # Radius within which a reported object is converted to keep-out discs at all.
    # The merged CARLA feed carries the whole level's static geometry (~1235 objects
    # -> ~3154 discs), and converting every one of them on every message costs about
    # 115 ms of CPU per message. That saturates the interpreter lock and starves the
    # control thread: measured 792 ms per tick against a 50 ms budget, with the tick's
    # own compute only ~31 ms of it. Nothing this far out can reach the horizon, so
    # gating before the conversion is free.
    #
    # Sized from the worst-case reach, not picked by feel:
    #   ego travel over the horizon  max_speed 10.5 * prediction_time 1.25 = 13.1 m
    #   reference anchor             distance_tolerance                    =  2.5 m
    #   keep-out                     ego_radius + safe_distance + r_obs    =  4.5 m
    #   detour bound                 max_avoidance_offset                  =  2.0 m
    #   an oncoming actor closing    10.5 * 1.25                           = 13.1 m
    #   furthest ego disc            ego_disc_offsets[-1]                  =  3.1 m
    #                                                                  total 38.3 m
    # 50 m keeps ~12 m of margin on that. It admits ~102 of the 1235 objects here;
    # 80 m admitted 212 and left the process at the interpreter-lock ceiling (91.5%
    # of a core, ~62 points of it ingestion), which is what capped the loop.
    # Raise it if max_speed, the horizon or the detour bound grow.
    # 0.0 disables the gate (parse everything), which is the f1tenth default.
    obstacle_ingest_radius: 50.0
    # Distance at which the projection guide starts growing toward its full radius.
    # Without it the projection switches on as a one-tick multi-metre sideways step
    # and the controller tracks that step with a lunge. The OCP keeps the full,
    # unramped keep-out at all times — this shapes only the tracking target.
    # NOTE: the detour bound above is evaluated against the RAMPED radius, so the
    # stop-vs-swerve decision cannot fire before the ramp is well underway. At
    # 8 m/s the ramp completes ~10 m out (sample_time * horizon * v) and the 2.0 m
    # bound is crossed ~16 m out, still ahead of the ~11 m braking distance — that
    # margin shrinks if this distance is lowered or the route speed is raised.
    keepout_engagement_distance: 25.0
    # No-progress watchdog: zero the command when a drive command is applied but
    # neither the reference index nor the position moves. 8.0 s (default 5.0)
    # because a CARLA ego can legitimately sit near-stationary at full throttle for
    # ~5 s while pulling away from the spawn.
    progress_watchdog_timeout: 8.0
    # Slack penalties are restart-only generated-cost settings. The linear term
    # keeps shallow margin use expensive; the quadratic term dominates deep
    # penetration while retaining a recovery path if the initial state is already
    # infeasible.
    obstacle_slack_weight: 1000.0
    obstacle_slack_quadratic_weight: 10000.0
    # State-based braking envelope OFF (advisory: diagnostics still logged, no
    # intervention) at CARLA scale. A/B on carla_town01_moving with 6 obstacles
    # (2026-08-02): envelope off left min physical clearance unchanged
    # (+0.7999 vs +0.7998 m), 0 overlaps, and finished 26% faster — the
    # straight-line envelope cannot see the planned swerve, so at 9 m/s it
    # latches on every pass and drags speed to ~1-2 m/s. Keep it TRUE on the
    # F1/10 configs (0.66 m keep-outs at 1.5 m/s — there it is load-bearing).
    # Consider re-enabling for live runs with MOVING obstacles until validated.
    # Hot-reloadable: ros2 param set <node> obstacle_braking_envelope true
    #
    # 2026-08-04: re-enabled with an envelope-local decel. Run D2 (envelope on at
    # the old settings) confirmed the over-braking above — 166 fires, median
    # applied speed 0.24 m/s, route stalled at idx 148 vs 450-576 with it off —
    # but two of its causes were defects, not conservatism:
    #   1. stopping_room was sized at |max_decel| = 3.0 m/s², a *comfort* planning
    #      decel. A last-resort stop is not bound by it, and the v²/2a term
    #      dominates the distance (10.1 of a sampled 13.65 m).
    #   2. the reaction window was measured on the wall clock while CARLA runs at
    #      RTF≈0.2, inflating it 0.25 s -> 0.42 s (≈1.3 m of phantom stopping room
    #      at 7.8 m/s). Fixed in base_tracker to use the ROS clock.
    # envelope_decel sizes the envelope AND the brake action it triggers; it does
    # NOT touch max_decel, which stays -3.0 so the reference speed ramp and the
    # stop-before-keep-out profile are unchanged.
    # KNOWN RESIDUAL: the trigger is still radial closing to the obstacle centre,
    # which reads a lateral pass-by as head-on (D2: obstacle 208 drew 116 fires
    # and never came nearer than 0.383 m). If far-field fires persist, the fix is
    # a CPA/collision-cone gate, not a larger decel.
    obstacle_braking_envelope: true
    envelope_decel: 6.0

    # Tuned Town01 tracking set (see carla_acados.yaml for the derivation).
    Q:  [5.0, 5.0, 15.0, 0.05]
    R:  [0.5, 100.0]
    Rd: [1.0, 1000.0]
    Qf: [10.0, 10.0, 30.0, 0.1]
    use_bryson_weights: false

    use_speed_profile: True
    max_lateral_accel: 1.0
    min_reference_speed: 0.3

    # Reference anchor distance (platform default 5.0 m over-anchors and cuts the
    # R~12 m corners). acados SQP holds down to 2.0 (1.8 fails) — 2.5 keeps margin.
    distance_tolerance: 2.5

    # Per-solve CSV for post-run safety/clearance analysis (node param, not a
    # launch arg). Uncomment and set a path to enable.
    # solver_log_file: '/tmp/carla_obstacle_run.csv'

    # acados C-code generation + Cython wrapper (regenerate when the obstacle
    # structure / horizon changes).
    generate_mpc_model: True
    build_with_cython: True
