/**:
  ros__parameters:
    use_sim_time: False

    wheelbase: 0.256

    distance_tolerance: 0.2

    horizon: 25
    sample_time: 0.05  # not used. Modify control_rate instead
    prediction_time: 1.25  # = sample_time(0.05) * horizon(25); 1/control_rate == 0.05
    control_rate: 20.0
    saturate_input: True
    allow_reversing: True

    # Solver failure policy. 'zero' stops on the first failure. 'hold_last' may
    # bridge only while every enabled gate passes; 0 disables that individual gate.
    # With both gates disabled, hold_last fails safe to zero (never holds unbounded).
    solver_failure_mode: 'hold_last'
    solver_failure_hold_count: 1
    solver_failure_hold_time: 0.1  # wall seconds since the last successful publish
    solver_failure_zero_on_saturation: True

    max_speed: 1.5
    min_speed: -1.5
    max_accel: 3.0
    max_decel: -3.0

    # Reference speed policy (per-horizon reference fed to the MPC).
    #   v_ref[h] = clip( min( recorded_profile[h], sqrt(max_lateral_accel/|κ[h]|) ),
    #                    min_reference_speed, min(desired_speed_or_profile_cap, max_speed) )
    # use_speed_profile: track the recorded/loaded speed column over the horizon (was
    #   previously ignored — the reference held constant). False = constant cap only.
    # max_lateral_accel: curvature speed cap (m/s²). 0.0 disables curvature limiting.
    #   ~3.0 (≈0.3g) is conservative for an F1/10; raise after calibrating tire grip.
    # min_reference_speed: forward creep floor (m/s) that lifts a noisy near-zero start so
    #   the vehicle pulls away. The end-of-path/goal terminator handles the actual stop,
    #   so this floor never traps the vehicle at the goal.
    use_speed_profile: True
    max_lateral_accel: 3.0
    min_reference_speed: 0.3
    # NOTE: 27 is a GUESS for the 4-Tec 2.0 VXL — measure the real lock-to-lock angle and
    # set it here. A sim test at 35 confirmed tight corners want >27 (4.9% of ticks) but did
    # NOT lower corner CTE, so steering authority is not the CTE bottleneck (the lookahead/
    # over-speed geometry is). Raise once measured for margin at the tightest corners.
    max_steer: 27.0
    min_steer: -27.0
    # deg/s at the road wheel (converted to rad/s internally). Derated from the
    # stock Traxxas 2075 servo's no-load 0.17 s/60deg (=352.94 deg/s) to account for the
    # steering linkage ratio and load. Refine with a measured lock-to-lock sweep.
    max_steer_rate: 183.346494

    # max_iter: solver iteration budget. Meaning depends on solver_type/solver:
    #   solver_type=quad, solver=qrqp  (DEFAULT): outer SQP iterations in sqpmethod.
    #       Warm-started RTI typically converges in 1-5 outer iters. 15-30 is safe.
    #       Original backend default: 200.
    #   solver_type=nlp,  solver=ipopt: IPOPT interior-point barrier iterations.
    #       Without warm-start: 50-300+ typical. With warm-start: 5-30.
    #       Original backend default: 2000 (continuous), 100 (discrete).
    #       WARNING: max_iter=15 is too low for cold-start IPOPT and will fail silently.
    #   solver_type=quad, solver=ipopt (via nlpsol): inner IPOPT iterations per QP.
    #       Same scale as nlp/ipopt above. Original default: 100.
    #   Opti/OSQP: first-order ADMM steps. Scale: O(100-4000). Original default: 2000.
    #       WARNING: max_iter=15 will almost certainly not converge with OSQP.
    max_iter: 200
    termination_condition: 0.1

    solver_type: quad
    solver: qrqp

    # CasADi discrete-formulation model (used when ode_type is a discrete kind):
    #   discrete_model_type: 'nonlinear' (full ODE) | 'ltv' (forward-Jacobian/
    #       Taylor linearization). NOTE: as consumed, 'ltv' is evaluated at the
    #       decision variables, so it is mathematically identical to
    #       'nonlinear' + 'euler' (it is NOT yet a true frozen-operating-point
    #       LTV/QP model).
    #   discrete_integration_method: 'rk4' (default) | 'euler'. Only these
    #       explicit schemes work for the MPC NLP; 'cvodes'/'rk'/'collocation'
    #       cannot be SX-expanded inside the NLP. Ignored when type='ltv'.
    discrete_model_type: nonlinear
    discrete_integration_method: rk4

    R: [0.01, 0.01]
    # EXPERIMENT 2 (speed-dominant): speed weight 100 > position 50 so the car HOLDS vref
    # and stops over-speeding into tight corners (the ~0.14 m/s over-speed was eating the
    # thin steering margin at idx~1282, R=0.73m / ~25deg of the 27deg limit). Position
    # kept at 50 for low CTE; Rd=10 for steer-rate damping. Revert with
    # `git checkout config/mpc_parameters.yaml`. History: [50,50,50,8]/Rd10 cleared
    # hairpin-1 but still over-sped 0.72 vs 0.58 -> failed at the tighter idx~1282 corner.
    Rd: [10., 10.]
    Q: [50.0, 50.0, 100.0, 8.0]
    Qf: [100.0, 100.0, 200.0, 40.0]

    generate_mpc_model: True
    build_with_cython: True

    # Bryson's rule weight computation (use_bryson_weights: true ignores Q/R/Rd/Qf above)
    # Q_ii = 1/e_max_i², R_jj = 1/u_max_j², Rd_jj = 1/udot_max_j²
    # Qf is set equal to Q. Rd uses max_jerk and max_steer_rate (already declared above).
    # NOTE: bryson_max_steer is in RADIANS (unlike max_steer which is in degrees).
    use_bryson_weights: false
    max_error_x: 1.0      # m     → Q_x   = 1.0
    max_error_y: 0.3      # m     → Q_y   ≈ 11.1  (tighter laterally)
    max_error_v: 0.5      # m/s   → Q_v   = 4.0
    max_error_psi: 0.1    # rad   → Q_psi = 100.0
    bryson_max_accel: 3.0 # m/s²  → R_a   ≈ 0.11
    bryson_max_steer: 0.4 # rad   → R_d   = 6.25  (NOT degrees)

    # Trajectory looping: 0 = stop at goal, -1 = loop indefinitely, N > 0 = run N laps then stop.
    loop: 0

    # MPC computation delay compensation (Method A: forward simulation with RK4)
    # Set estimated_delay to sensor_lag + expected_solve_time + actuator_deadtime (seconds).
    # delay_compensation_method: 'forward_simulation' (only supported option for now)
    delay_compensation_enabled: false
    delay_compensation_method: 'forward_simulation'
    estimated_delay: 0.0
