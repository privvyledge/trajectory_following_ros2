[develop]
script_dir=$base/lib/trajectory_following_ros2
[install]
install_scripts=$base/lib/trajectory_following_ros2

[flake8]
exclude =
    trajectory_following_ros2/old
    trajectory_following_ros2/cvxpy
    trajectory_following_ros2/purepursuit/old
    trajectory_following_ros2/utils/autoware_auto_mpc_utils.py
    trajectory_following_ros2/utils/autoware_universe_mpc_utils.py
    trajectory_following_ros2/utils/TrajectoryOld.py
    trajectory_following_ros2/utils/VehicleModel.py
    trajectory_following_ros2/utils/Trajectory.py
    main.py
    temp.py
extend-ignore =
    E501,
    I100,I101,I201,I202,
    Q000,Q001,Q002,
    D100,D101,D102,D103,D104,D105,D107,
    D200,D202,D203,D204,D205,D208,D209,D210,
    D300,D400,D401,D402,D403,D404,
    CNL100,
    A001,A002,
    C408,
    B901,B902,
    F841,
    F403,F405,
    E122,E127,E128

[pydocstyle]
match_dir = (?!old|cvxpy|purepursuit).*
ignore = D100,D101,D102,D103,D104,D105,D107,D200,D202,D203,D204,D205,D208,D209,D210,D212,D213,D214,D300,D400,D401,D402,D403,D404,D406,D407,D409,D411,D413,D414,D415,D417